name: Update feed

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC). GitHub may delay it a little.
  workflow_dispatch: {}        # lets you press "Run" manually any time

permissions:
  contents: write              # so the run can commit the updated feed back

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run filter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline.py

      - name: Commit results
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/articles.json state/seen.json
          git commit -m "feed update" || echo "nothing to commit"
          git push
