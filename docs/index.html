<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fréttvaldur</title>
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A; --surface:#1C1F24; --surface2:#23272E; --line:#2E333B;
    --text:#E8E6E1; --muted:#888F99; --accent:#7E9CC4;
    --c-arkitektur:#7E9CC4; --c-fasteignir:#8FA67A; --c-skipulag:#C2A15E;
    --c-efnahagur:#6FA89C; --c-frettir:#C77B72; --c-menning:#9B86BC;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  header{
    position:sticky;top:0;z-index:10;
    background:rgba(20,22,26,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 15px) 20px 0;
  }
  .bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    max-width:940px;margin:0 auto}
  .mark{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;
    font-size:21px}
  .mark span{color:var(--accent)}
  .updated{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
    white-space:nowrap}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 13px;
    scrollbar-width:none;max-width:940px;margin:0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;border:1px solid var(--line);background:transparent;
    color:var(--muted);padding:7px 12px;border-radius:999px;white-space:nowrap;
    cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--text);color:var(--bg);
    border-color:var(--text)}

  main{max-width:940px;margin:0 auto;padding:14px 20px 64px}

  .card{position:relative;display:grid;grid-template-columns:1fr;gap:0;
    background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--muted);border-radius:8px;overflow:hidden;
    margin:15px 0}
  .thumb{width:100%;aspect-ratio:16/9;background:var(--surface2);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:15px 17px 14px}
  .eyebrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .cat{font-weight:500}
  .src{color:var(--text)}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.6}
  h2{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.01em;
    font-size:19px;line-height:1.3;margin:0 0 8px}
  .card a:hover h2{color:var(--accent)}
  .summary{color:#C3C7CD;font-size:15px;margin:0}
  .spin{display:flex;gap:8px;margin-top:11px;padding:9px 11px;border-radius:5px;
    background:rgba(199,123,114,.1);border:1px solid rgba(199,123,114,.32);
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.45;
    color:#E0A39B}
  .actions{display:flex;gap:9px;margin-top:13px;padding-top:12px;
    border-top:1px solid var(--line)}
  .vote{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:6px 11px;border-radius:5px;cursor:pointer}
  .vote:hover{border-color:var(--muted);color:var(--text)}
  .vote[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
    background:rgba(126,156,196,.1)}

  /* laptop: image left, text right */
  @media(min-width:620px){
    .card.has-img{grid-template-columns:240px 1fr}
    .card.has-img .thumb{aspect-ratio:auto;height:100%;min-height:160px}
  }

  .empty{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:13px;
    text-align:center;padding:80px 20px;line-height:1.7}
  .tools{text-align:center;margin-top:30px}
  .tools button{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
    background:none;border:none;text-decoration:underline;cursor:pointer}

  a:focus-visible,.chip:focus-visible,.vote:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:no-preference){
    .card{animation:rise .4s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    h2,.vote{transition:color .15s,border-color .15s,background .15s}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="mark">FRÉTT<span>VALDUR</span></div>
    <div class="updated mono" id="updated"></div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="feed"></main>

<script>
const CATS = {
  arkitektur:"Arkitektúr", fasteignir:"Fasteignir", skipulag:"Skipulag",
  efnahagur:"Efnahagur", frettir:"Fréttir", menning:"Menning"
};
let ITEMS = [], FILTER = "all";
const votes = JSON.parse(localStorage.getItem("votes") || "{}");

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function relTime(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const m = Math.round((Date.now()-d)/60000);
  if(m<1) return "núna";
  if(m<60) return m+" mín";
  if(m<1440) return Math.round(m/60)+" klst";
  return Math.round(m/1440)+" d";
}

function vote(id,val){
  votes[id] = (votes[id]===val) ? 0 : val;
  localStorage.setItem("votes", JSON.stringify(votes));
  render();
}

function render(){
  const feed = document.getElementById("feed");
  const shown = ITEMS.filter(a => FILTER==="all" || a.category===FILTER);
  if(!shown.length){
    feed.innerHTML = `<div class="empty">Engar fréttir í þessum flokki enn.<br>
      Síðan uppfærist sjálfkrafa á klukkutíma fresti.</div>`;
    return;
  }
  feed.innerHTML = shown.map(a=>{
    const col = `var(--c-${a.category})`;
    const v = votes[a.id] || 0;
    const img = a.image ? `<div class="thumb"><img loading="lazy" src="${esc(a.image)}"
      onerror="this.closest('.card').classList.remove('has-img');this.parentElement.remove()"></div>` : "";
    return `<article class="card ${a.image?'has-img':''}" style="border-left-color:${col}">
      ${img}
      <div class="body">
        <div class="eyebrow">
          <span class="cat" style="color:${col}">${CATS[a.category]||a.category}</span>
          <span class="dot"></span><span class="src">${esc(a.source)}</span>
          ${a.published?`<span class="dot"></span><span>${relTime(a.published)}</span>`:""}
        </div>
        <a href="${esc(a.link)}" target="_blank" rel="noopener"><h2>${esc(a.title)}</h2></a>
        <p class="summary">${esc(a.summary)}</p>
        ${a.spin_flag?`<div class="spin mono">⚠&nbsp;<span>${esc(a.spin_note)}</span></div>`:""}
        <div class="actions">
          <button class="vote" aria-pressed="${v===1}" onclick="vote('${a.id}',1)">Meira svona</button>
          <button class="vote" aria-pressed="${v===-1}" onclick="vote('${a.id}',-1)">Ekki sýna</button>
        </div>
      </div>
    </article>`;
  }).join("") + `<div class="tools">
    <button onclick="exportVotes()">Sækja umsagnir til að uppfæra preferences</button></div>`;
}

function exportVotes(){
  const liked=[], disliked=[];
  ITEMS.forEach(a=>{ if(votes[a.id]===1)liked.push("• "+a.title);
    if(votes[a.id]===-1)disliked.push("• "+a.title); });
  const txt = "KEEP more like:\n"+liked.join("\n")+"\n\nDROP, don't show:\n"+disliked.join("\n");
  navigator.clipboard?.writeText(txt);
  alert("Afritað. Límdu inn í preferences.md til að kenna síunni.");
}

function chips(){
  const wrap = document.getElementById("chips");
  const all = ["all", ...Object.keys(CATS)];
  wrap.innerHTML = all.map(k=>{
    const label = k==="all" ? "Allt" : CATS[k];
    return `<button class="chip" aria-pressed="${FILTER===k}"
      onclick="FILTER='${k}';chips();render()">${label}</button>`;
  }).join("");
}

fetch("articles.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  ITEMS = d.items||[];
  document.getElementById("updated").textContent =
    d.updated ? "uppfært " + relTime(d.updated) + " síðan" : "";
  chips(); render();
}).catch(()=>{
  document.getElementById("feed").innerHTML =
    `<div class="empty">Næ ekki í fréttir. Hefur keyrslan klárast einu sinni?</div>`;
  chips();
});

if("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
